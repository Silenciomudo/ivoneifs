name: Deploy Automático

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: zsjmksdkawstrhxkzyls
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1

      - name: Configurar secrets Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN ausente — pulando deploy Supabase"
            exit 0
          fi
          if [ -n "$OPENAI_API_KEY" ]; then
            supabase secrets set OPENAI_API_KEY="$OPENAI_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
            supabase secrets set OPENAI_MODEL="gpt-4o-mini" --project-ref "$SUPABASE_PROJECT_REF"
          fi

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN ausente — pulando deploy"
            exit 0
          fi
          supabase functions deploy health --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy openai --project-ref "$SUPABASE_PROJECT_REF"

  pages:
    runs-on: ubuntu-latest
    needs: supabase
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar site estático
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' --exclude='node_modules' --exclude='.github' \
            --exclude='.env' --exclude='server.js' --exclude='netlify' \
            --exclude='package-lock.json' --exclude='package.json' \
            ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
